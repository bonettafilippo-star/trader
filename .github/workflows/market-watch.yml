name: Market Watch

on:
  schedule:
    # Ogni ora, minuto 5. Orario UTC (GitHub Actions non usa il fuso locale).
    - cron: "5 * * * *"
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub (tab Actions -> Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run market watch script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/market_watch.py

      - name: Commit updated dashboard
        run: |
          git config user.name "market-watch-bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Aggiorna dashboard [skip ci]"
          git push
